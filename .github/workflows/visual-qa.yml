name: Visual QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/victxr-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/victxr-preview.log
          exit 1

      - name: Capture visual states
        run: npm run visual

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-${{ github.sha }}
          path: artifacts/visual
          if-no-files-found: error
          retention-days: 14
