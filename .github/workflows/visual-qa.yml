name: Visual QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build
        run: npm run build

      - name: Type and content checks
        run: npm run check

      - name: Static production audit
        run: npm run audit:static

      - name: Start production-like Cloudflare preview
        run: |
          npx wrangler dev --local --ip 127.0.0.1 --port 4321 > /tmp/victxr-cloudflare-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/victxr-cloudflare-preview.log
          exit 1

      - name: Capture Cloudflare-specific visual states
        run: npm run visual:core

      - name: Start stable browser preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4324 > /tmp/victxr-browser-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4324 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/victxr-browser-preview.log
          exit 1

      - name: Cross-browser QA
        env:
          VISUAL_BASE_URL: "http://127.0.0.1:4324"
        run: npm run cross-browser

      - name: Accessibility and performance budgets
        env:
          VISUAL_BASE_URL: "http://127.0.0.1:4324"
        run: npm run audit:quality

      - name: Stop stable browser preview
        run: npx astro preview stop || true

      - name: Build future contact state
        env:
          PUBLIC_CONTACT_WHATSAPP: "+37120000000"
          PUBLIC_CONTACT_INSTAGRAM: "https://www.instagram.com/victxr.lev/"
        run: npm run build

      - name: Start future contact preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4322 > /tmp/victxr-contacts-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4322 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/victxr-contacts-preview.log
          exit 1

      - name: Verify enabled contact state
        env:
          CONTACTS_BASE_URL: "http://127.0.0.1:4322"
        run: npm run audit:contacts

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-qa-${{ github.sha }}
          path: artifacts/visual
          if-no-files-found: warn
          retention-days: 14
